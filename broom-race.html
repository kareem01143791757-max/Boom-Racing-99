<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>سباق المكانس السحرية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#f0c060}*{box-sizing:border-box;margin:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#150a30;font-family:Cairo,Tahoma,sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.fr{position:fixed;border:24px solid transparent;border-image:var(--panel) 55 fill/24px stretch;padding:0 4px;text-align:center;filter:drop-shadow(0 0 8px #b57bff88)}
.fr small{display:block;color:#e8d3ff;font-size:12px}.big{font-size:26px;font-weight:900;color:var(--g)}
#bars{position:fixed;top:88px;left:10px;width:190px}.bar{font-size:13px;margin:5px 0;background:#1c0d3ccc;border:1px solid #f0c06088;border-radius:20px;padding:3px 10px}
.bar i{display:block;height:5px;background:#0006;border-radius:5px;margin-top:2px}.bar u{display:block;height:100%;border-radius:5px;width:0}
#hz{right:10px;top:42%;display:none;min-width:190px;filter:drop-shadow(0 0 14px #ff3b2f)}#hz b{color:#ffd36b;font-size:17px;display:block}
#sp{position:fixed;left:6px;bottom:6px;width:170px;height:170px;background:var(--round) center/100% 100%;text-align:center}#sp div{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;line-height:1.1;width:90px}#sp b{display:block;font-size:30px;color:var(--g)}#ga{position:absolute;inset:25%;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%)}
#ab{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.ab{width:68px;text-align:center;font-size:11px;font-weight:700;cursor:pointer}.ab .ic{position:relative;width:64px;height:64px;margin:auto;background-size:100% 100%;font-size:24px;line-height:64px;filter:drop-shadow(0 0 6px #7a5cff)}
.ab .n{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:#1c0d3c;border:1px solid var(--g);border-radius:10px;font-size:12px;line-height:15px;padding:0 6px}
.ab.off{opacity:.4}.ab.on .ic{box-shadow:0 0 18px #5ff}.ab span{display:block;background:#1c0d3ccc;border:1px solid #f0c06088;border-radius:6px;margin-top:6px}
#br{position:fixed;right:8px;bottom:8px;display:flex;align-items:flex-end;gap:8px}#mmw{position:relative;width:190px;height:190px;background:var(--round) center/100% 100%;flex:none}#mm{position:absolute;left:47px;top:47px;width:96px;height:96px;border-radius:50%}
#ds{position:static}#ds b{font-size:30px;color:var(--g)}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#150a30cc;background-size:cover;text-align:center;gap:12px;padding:16px}
.ov h1{font-size:clamp(30px,6vw,56px);color:var(--g);text-shadow:0 0 20px #b57bff}
button{font:inherit;font-weight:700;font-size:20px;color:#fff;padding:8px 26px;margin:4px;border-radius:12px;border:2px solid var(--g);background:linear-gradient(#5a2fa0,#2a1450);cursor:pointer;box-shadow:0 0 12px #b57bff88}button:hover{filter:brightness(1.3)}
#cdn{font-size:110px;font-weight:900;color:var(--g);text-shadow:0 0 30px #b57bff;position:fixed;top:25%;width:100%;text-align:center;pointer-events:none}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#1c0d3ccc;border:1px solid var(--g);padding:4px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
input{font:inherit;font-size:20px;padding:8px 14px;border-radius:12px;border:2px solid var(--g);background:#1c0d3c;color:#fff;text-align:center;margin:4px}
table{border-collapse:collapse;font-size:20px}td{padding:4px 16px;border-bottom:1px solid #f0c06055}
#hud{pointer-events:none}#ab,.ab{pointer-events:auto;touch-action:manipulation}
@media(max-width:800px){.fr{border-width:13px;border-image:var(--panel) 55 fill/13px stretch;font-size:12px}.big{font-size:17px}.fr small{font-size:10px}
#bars{top:80px;left:4px;width:118px}.bar{font-size:10px;margin:3px 0;padding:2px 8px}#hz{right:4px;top:36%;min-width:120px}#hz b{font-size:12px}
#sp{left:2px;bottom:66px;width:112px;height:112px}#sp div{font-size:9px;width:60px}#sp b{font-size:20px}
#br{right:2px;bottom:66px;flex-direction:column;align-items:flex-end;gap:0}#mmw{width:120px;height:120px}#mm{left:30px;top:30px;width:60px;height:60px}#ds{font-size:10px}#ds b{font-size:16px}
#ab{bottom:4px;gap:3px;width:100%;justify-content:center;left:0;transform:none}.ab{width:56px}.ab .ic{width:46px;height:46px;line-height:46px;font-size:18px}.ab span{font-size:9px;margin-top:3px}}
@media(max-height:480px){#sp{bottom:2px;width:100px;height:100px}#br{bottom:2px;flex-direction:row}#ds{display:none}#ab{bottom:2px;left:50%;width:auto;transform:translateX(-50%)}.ab span{display:none}#mmw{width:110px;height:110px}#mm{left:28px;top:28px;width:55px;height:55px}}
</style></head><body>

function peerRoom(code){return new Promise((resolve,reject)=>{

 const room={presence:async p=>{for(const k in p){if(p[k]===null)delete my[k];else my[k]=p[k]}if(conn&&conn.open)conn.send({t:'p',p:my})},
  peers:()=>{const ids=new Set(Object.keys(st));ids.add(myId);return[...ids].map(id=>({peer:id,isMe:id==myId,sameTab:id==myId,kind:'viewer',presence:id==myId?my:st[id]}))},
  onPeers:f=>{cbs.push(f);return()=>{cbs=cbs.filter(x=>x!=f)}},
  leave:async()=>{clearInterval(room.iv);try{pr&&pr.destroy()}catch(e){}}};
 const fin=ok=>{if(done)return;done=1;clearTimeout(to);ok?resolve(room):reject(ok)};const to=setTimeout(()=>{if(!done){done=1;reject(new Error('timeout'))}},15000);
 pr=new Peer(ID);
 pr.on('open',id=>{myId=id;st={};st[id]=my;room.iv=setInterval(bc,100);fin(true)});
 pr.on('connection',c=>{conns.push(c);c.on('data',d=>{if(d&&d.t=='p'&&d.p&&typeof d.p=='object'){st[c.peer]=d.p;notify()}});c.on('close',()=>{delete st[c.peer];conns=conns.filter(x=>x!=c);bc()})});
 pr.on('error',e=>{if(e&&e.type=='unavailable-id'&&!myId){const g=new Peer();pr=g;g.on('open',id=>{myId=id;conn=g.connect(ID,{reliable:true});

   g.on('error',e2=>{if(!done){done=1;reject(e2)}})}else if(!done){done=1;reject(e)}})})}
